name: Build & Upload iOS App (TestFlight)

on:
  workflow_dispatch: {}

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Sync web assets (el proyecto ios/ ya esta commiteado, usa SPM, no CocoaPods)
        run: npx cap sync ios

      - name: Install Apple certificate (solo el identity, el perfil lo maneja Xcode automaticamente)
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Setup App Store Connect API key
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        run: |
          echo -n "$APPLE_API_KEY_BASE64" | base64 --decode -o "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"

      - name: Create export options plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF

      # Firma AUTOMATICA: con -allowProvisioningUpdates + la API key, Xcode crea/elige
      # el provisioning profile correcto solo para el target "App" (que lo necesita) y
      # no intenta aplicarselo a los paquetes SPM como RevenueCat (que no lo necesitan,
      # y que fallaban cuando forzabamos el perfil de forma manual en todo el proyecto).
      - name: Archive app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8" \
            -authenticationKeyID "${APPLE_API_KEY_ID}" \
            -authenticationKeyIssuerID "${APPLE_API_ISSUER}" \
            archive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}"

      - name: Export .ipa
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8" \
            -authenticationKeyID "${APPLE_API_KEY_ID}" \
            -authenticationKeyIssuerID "${APPLE_API_ISSUER}"

      - name: Upload to TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          IPA_PATH=$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)
          xcrun altool --upload-app -f "$IPA_PATH" -t ios \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true

name: Build & Upload iOS App (TestFlight)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Sync web assets (el proyecto ios/ ya esta commiteado, usa SPM, no CocoaPods)
        run: npx cap sync ios

      # La plantilla de Capacitor no reenvia el token APNs al plugin de push: sin esto el iPhone nunca lo recibe.
      - name: Parchear AppDelegate para recibir el token de push
        run: |
          F=ios/App/App/AppDelegate.swift
          python3 - "$F" << 'PYEOF'
          import sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          if "didRegisterForRemoteNotificationsWithDeviceToken" not in s:
              add = """
              func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)
              }

              func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
              }

          """
              i = s.rstrip().rfind("}")
              s = s[:i] + add + s[i:]
              open(p, "w", encoding="utf-8").write(s)
          PYEOF
          grep -n "didRegisterForRemoteNotificationsWithDeviceToken" "$F"

      - name: Configure AdMob (Info.plist)
        env:
          ADMOB_IOS_APP_ID: ${{ vars.ADMOB_IOS_APP_ID }}
        run: |
          PLIST=ios/App/App/Info.plist
          # Sin ADMOB_IOS_APP_ID (Settings > Secrets and variables > Actions > Variables) se usa el ID de PRUEBA de Google.
          if [ -z "$ADMOB_IOS_APP_ID" ]; then echo "::warning::Falta la variable ADMOB_IOS_APP_ID: esta build usa el ID de PRUEBA de AdMob (valido para TestFlight, NO para publicar en la App Store)"; fi
          APP_ID="${ADMOB_IOS_APP_ID:-ca-app-pub-3940256099942544~1458002511}"
          PB=/usr/libexec/PlistBuddy
          $PB -c "Delete :GADApplicationIdentifier" "$PLIST" 2>/dev/null || true
          $PB -c "Add :GADApplicationIdentifier string $APP_ID" "$PLIST"
          $PB -c "Delete :NSUserTrackingUsageDescription" "$PLIST" 2>/dev/null || true
          $PB -c "Add :NSUserTrackingUsageDescription string Usaremos este identificador para mostrarte anuncios más relevantes. Puedes rechazarlo y la app funcionará igual." "$PLIST"
          $PB -c "Delete :SKAdNetworkItems" "$PLIST" 2>/dev/null || true
          $PB -c "Add :SKAdNetworkItems array" "$PLIST"
          $PB -c "Add :SKAdNetworkItems:0 dict" "$PLIST"
          $PB -c "Add :SKAdNetworkItems:0:SKAdNetworkIdentifier string cstr6suwn9.skadnetwork" "$PLIST"

      # Sin estas claves, iOS deniega el acceso a la camara/galeria en silencio
      # y ni siquiera llega a mostrar el dialogo de permiso al usuario.
      - name: Configurar permisos de camara y galeria (Info.plist)
        run: |
          PLIST=ios/App/App/Info.plist
          PB=/usr/libexec/PlistBuddy
          $PB -c "Delete :NSCameraUsageDescription" "$PLIST" 2>/dev/null || true
          $PB -c "Add :NSCameraUsageDescription string Necesitamos acceder a la camara para que puedas publicar tus Tics con foto o video." "$PLIST"
          $PB -c "Delete :NSPhotoLibraryUsageDescription" "$PLIST" 2>/dev/null || true
          $PB -c "Add :NSPhotoLibraryUsageDescription string Necesitamos acceder a tus fotos para que puedas elegir una imagen al publicar un Tic." "$PLIST"
          $PB -c "Delete :NSPhotoLibraryAddUsageDescription" "$PLIST" 2>/dev/null || true
          $PB -c "Add :NSPhotoLibraryAddUsageDescription string Necesitamos guardar fotos en tu galeria cuando lo pidas." "$PLIST"
          $PB -c "Delete :NSLocationWhenInUseUsageDescription" "$PLIST" 2>/dev/null || true
          $PB -c "Add :NSLocationWhenInUseUsageDescription string Usamos tu ubicacion para mostrarte en el mapa y etiquetar el lugar de tus Tics." "$PLIST"

      - name: Generate iOS app icon
        run: npx @capacitor/assets generate --ios

      # Firma MANUAL, igual que en el repo privado (que lleva mas de un mes subiendo
      # builds sin errores): todo (CODE_SIGN_STYLE, CODE_SIGN_IDENTITY,
      # PROVISIONING_PROFILE_SPECIFIER, DEVELOPMENT_TEAM) ya esta fijado en el
      # .pbxproj solo para el target "App" (Release), asi que xcodebuild no
      # necesita ningun override por linea de comandos y los paquetes SPM
      # (RevenueCat, etc.) no se ven afectados.
      - name: Install Apple certificate and provisioning profile
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          CERT_PATH=$RUNNER_TEMP/dist_cert.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$IOS_DIST_CERT_BASE64" | base64 --decode -o $CERT_PATH
          echo -n "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode -o $PROFILE_PATH

          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERT_PATH -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$IOS_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      # Avisos push en iPhone: se activan SOLO si el perfil de aprovisionamiento instalado ya incluye "aps-environment"
      # (App ID con Push Notifications + perfil regenerado despues). Si no lo incluye, la build sale igual pero sin avisos.
      - name: Activar Push Notifications (entitlements) si el perfil lo permite
        run: |
          if security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | grep -q "aps-environment"; then
            echo "El perfil incluye Push Notifications: se activan los avisos push."
          else
            echo "::warning::El perfil de aprovisionamiento NO incluye Push Notifications. Esta build saldra SIN avisos push."
            exit 0
          fi
          cat > ios/App/App/App.entitlements << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>aps-environment</key>
              <string>production</string>
          </dict>
          </plist>
          EOF
          gem install xcodeproj --no-document
          ruby -e '
            require "xcodeproj"
            project = Xcodeproj::Project.open("ios/App/App.xcodeproj")
            target = project.targets.find { |t| t.name == "App" }
            raise "No se encontro el target App" unless target
            target.build_configurations.each do |config|
              config.build_settings["CODE_SIGN_ENTITLEMENTS"] = "App/App.entitlements"
            end
            group = project.main_group.find_subpath("App", false)
            group.new_file("App.entitlements") if group && group.files.none? { |f| f.path == "App.entitlements" }
            project.save
          '

      - name: Install App Store Connect API key
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APPSTORE_API_KEY_BASE64" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8

      # Numero de build: se consulta el ultimo build YA SUBIDO a App Store Connect para este
      # bundle id (sea cual sea el repo que lo subiera) y se usa el siguiente. Asi siempre es
      # correlativo (124, 125, ...) y nunca choca, sin depender del numero de run de este repo.
      - name: Calcular siguiente numero de build
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          BUNDLE_ID: com.seeyouonline.app
          MARKETING_VERSION: "1.01"
        run: |
          pip3 install --quiet --break-system-packages pyjwt cryptography

          NEXT_BUILD=$(python3 - << 'PYEOF'
          import jwt, time, os, json, urllib.request

          key_id = os.environ["APPSTORE_API_KEY_ID"]
          issuer_id = os.environ["APPSTORE_API_ISSUER_ID"]
          bundle_id = os.environ["BUNDLE_ID"]
          marketing_version = os.environ["MARKETING_VERSION"]
          key_path = os.path.expanduser(f"~/.appstoreconnect/private_keys/AuthKey_{key_id}.p8")
          private_key = open(key_path).read()

          token = jwt.encode(
              {"iss": issuer_id, "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
              private_key,
              algorithm="ES256",
              headers={"kid": key_id, "typ": "JWT"},
          )
          headers = {"Authorization": f"Bearer {token}"}

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          apps = get(f"https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]={bundle_id}")
          app_id = apps["data"][0]["id"]

          # Filtramos por la version marketing actual: asi, al subir de version, el build
          # vuelve a arrancar limpio desde 1 en vez de arrastrar los numeros de la version anterior.
          builds = get(f"https://api.appstoreconnect.apple.com/v1/builds?filter[app]={app_id}&filter[preReleaseVersion.version]={marketing_version}&sort=-version&limit=1")
          if builds["data"]:
              last_version = int(builds["data"][0]["attributes"]["version"])
          else:
              last_version = 0

          print(last_version + 1)
          PYEOF
          )

          echo "Siguiente numero de build: $NEXT_BUILD"
          echo "NEXT_BUILD=$NEXT_BUILD" >> "$GITHUB_ENV"

      - name: Set build number
        run: |
          cd ios/App
          xcrun agvtool new-version -all "$NEXT_BUILD"

      - name: Archive signed iOS app
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination 'generic/platform=iOS' \
            archive

      - name: Export signed .ipa
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROVISION_PROFILE_NAME: ${{ secrets.IOS_PROVISION_PROFILE_NAME }}
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.seeyouonline.app</key>
                  <string>${IOS_PROVISION_PROFILE_NAME}</string>
              </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          IPA_PATH=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -n 1)

          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER_ID"

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/dist_cert.p12" "$RUNNER_TEMP/profile.mobileprovision" 2>/dev/null || true
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles 2>/dev/null || true

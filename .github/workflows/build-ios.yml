name: Build iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor (copia src/ al proyecto nativo de iOS)
        run: npx cap sync ios

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.app || true

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install --repo-update

      # --- Build SIN firmar (sirve para validar que compila, no genera IPA instalable) ---
      - name: Build (sin firma, solo validacion)
        if: ${{ secrets.APPLE_CERTIFICATE_P12 == '' }}
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      # --- Build y archive FIRMADOS (genera .ipa listo para TestFlight/App Store) ---
      # Requiere configurar estos Secrets del repositorio en GitHub:
      #   APPLE_CERTIFICATE_P12        -> certificado de distribucion (.p12) en base64
      #   APPLE_CERTIFICATE_PASSWORD   -> password del .p12
      #   APPLE_PROVISIONING_PROFILE   -> perfil de aprovisionamiento (.mobileprovision) en base64
      #   APP_STORE_CONNECT_API_KEY    -> (opcional) API Key de App Store Connect en base64, para subir automaticamente
      #   APP_STORE_CONNECT_KEY_ID
      #   APP_STORE_CONNECT_ISSUER_ID
      - name: Importar certificado y perfil de aprovisionamiento
        if: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
        env:
          CERT_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain

          echo "$CERT_P12" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Archive y exportar IPA firmado
        if: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            archive

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist ../../.github/exportOptions.plist

      - name: Subir IPA como artefacto
        if: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: SeeYou-iOS-ipa
          path: ${{ runner.temp }}/export/*.ipa
